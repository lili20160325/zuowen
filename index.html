<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff1e4">
<title>作文小作坊 · 五年级</title>
<style>
:root{
  --ink:#3e2a4a;--ink2:#7c6a8c;--card:#fffdf9;--line:#f0e2d2;
  --pink:#ff6d9a;--pink2:#ffe0eb;--purple:#7464f0;--purple2:#ece8ff;
  --mint:#14956d;--mint2:#d9f6ec;--sun:#e8960a;--sun2:#fff1cc;
  --coral:#ff7a59;--coral2:#ffe4dc;--sky:#3d8fd1;--sky2:#e3f2ff;
  --shadow:0 8px 22px rgba(90,50,70,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;max-width:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  color:var(--ink);font-size:17px;line-height:1.65;
  background:linear-gradient(165deg,#fff6ea 0%,#ffe6f0 42%,#e7f4ff 100%) fixed;
  min-height:100vh;min-height:100dvh;
}
button,textarea{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
textarea{user-select:text;-webkit-user-select:text}
h1,h2,h3,p{margin:0}
.wrap{max-width:880px;margin:0 auto;padding:14px 16px 36px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top h1,.top h2{font-size:20px;line-height:1.3;min-width:0}
.grow{flex:1;min-width:0}
.icon{
  min-width:48px;min-height:48px;padding:0 12px;border-radius:16px;
  background:rgba(255,255,255,.88);box-shadow:0 3px 0 rgba(62,42,74,.08);
  font-weight:800;font-size:15px;flex:none;
}
.logo{font-size:30px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#ff6d9a,#7464f0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--ink2);font-size:14px;margin-top:2px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;min-width:0}
.lead{font-size:16px;margin:12px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);min-height:72px}
.stat b{display:block;font-size:26px;margin-top:2px}
.stat span{color:var(--ink2);font-size:13px;font-weight:700}
.actions{display:grid;gap:10px;margin-top:12px}
.btn{
  min-height:52px;border-radius:18px;padding:12px 16px;font-size:18px;font-weight:800;
  background:#fff;box-shadow:0 4px 0 rgba(62,42,74,.1);text-align:center;width:100%;
}
.btn:active{transform:translateY(2px)}
.btn.primary{background:linear-gradient(180deg,#ff8eb4,#ff5d92);color:#fff;box-shadow:0 5px 0 #d84a7c}
.btn.purple{background:linear-gradient(180deg,#9b90ff,#7464f0);color:#fff;box-shadow:0 5px 0 #5346c4}
.btn.mint{background:linear-gradient(180deg,#3dcb9b,#14956d);color:#fff;box-shadow:0 5px 0 #0d7354}
.btn.ghost{background:rgba(255,255,255,.75)}
.btn small{display:block;font-weight:600;font-size:13px;opacity:.85;margin-top:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 > *{min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--purple2);color:#5346c4}
.tag.记事{background:var(--coral2);color:#c24b30}
.tag.写人{background:var(--pink2);color:#c43b6c}
.tag.写景{background:var(--mint2);color:#0d7354}
.tag.想象{background:var(--purple2);color:#5346c4}
.tag.看图写话{background:var(--sun2);color:#9a6408}
.tag.状物{background:#ffe8cc;color:#b85a00}
.stepbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:4px 0 12px}
.stepbar i{
  display:block;text-align:center;font-style:normal;font-size:13px;font-weight:800;
  background:rgba(255,255,255,.7);border-radius:12px;padding:8px 2px;color:var(--ink2);min-width:0;
}
.stepbar i.on{background:#fff;color:var(--purple);box-shadow:var(--shadow)}
.stepbar i.done{color:var(--mint)}
.ask{font-size:16px;background:#fff8ee;border-radius:16px;padding:12px;margin-bottom:10px}
.qtitle{font-size:18px;font-weight:900;margin:6px 0}
.choice{
  display:block;width:100%;text-align:left;min-height:52px;margin:8px 0;padding:12px 14px;
  border-radius:16px;background:#fff;border:3px solid transparent;
  box-shadow:0 4px 0 rgba(62,42,74,.08);font-size:16.5px;line-height:1.5;font-weight:700;
}
.choice.bad{border-color:#f0b0a0;background:#fff6f3}
.choice.good{border-color:#8ed9bf;background:#f1fff8}
.choice:disabled{cursor:default}
.why{
  display:none;background:#fff3ec;border-radius:14px;padding:10px 12px;color:#8a4b38;
  font-size:15px;margin-top:4px;
}
.why.show{display:block}
.why.good{background:var(--mint2);color:#0d7354}
.hint{color:var(--ink2);font-size:14px;margin:4px 0 8px}
.field{margin:0 0 12px;min-width:0}
.field label{display:block;font-weight:900;margin-bottom:4px}
textarea{
  display:block;width:100%;max-width:100%;resize:vertical;min-height:88px;
  border:3px solid #eadfce;border-radius:16px;padding:12px;font-size:18px;line-height:1.7;background:#fff;
}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{
  min-height:44px;max-width:100%;padding:8px 12px;border-radius:999px;background:#fff;
  border:2px solid #efe4f6;font-weight:700;font-size:14px;text-align:left;line-height:1.4;
}
.chip:active{background:var(--purple2)}
.wbar{background:#fff;border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:12px}
#wc{font-weight:900;font-size:18px}
#wc b{color:var(--purple);font-size:26px}
#wcHint{color:var(--ink2);font-size:13px}
.sec-h{font-size:15px;font-weight:900;margin:8px 0}
.pcount{color:var(--ink2);font-size:13px;font-weight:700}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tick{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  background:#fff;border-radius:16px;padding:12px;margin:8px 0;min-height:52px;
  border:3px solid transparent;box-shadow:0 4px 0 rgba(62,42,74,.06);font-size:16px;font-weight:700;
}
.tick .box{
  width:28px;height:28px;border-radius:8px;border:3px solid #e2d4ea;flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;
}
.tick.on{border-color:#b7ecd8;background:#f4fffb}
.tick.on .box{background:var(--mint);border-color:var(--mint)}
.list{display:grid;gap:10px}
.draft{
  display:block;width:100%;text-align:left;background:#fff;border-radius:18px;padding:14px;
  box-shadow:var(--shadow);min-height:72px;
}
.draft b{display:block;font-size:18px}
.draft span{color:var(--ink2);font-size:13px}
.topic{
  display:block;width:100%;text-align:left;background:#fff;border-radius:18px;padding:14px;
  box-shadow:var(--shadow);min-height:72px;margin:0 0 10px;
}
.topic b{display:block;font-size:18px;margin:4px 0}
.cat-h{font-weight:900;margin:14px 0 8px}
.stem{background:#fff;border-radius:16px;padding:12px;font-size:17px;font-weight:700;box-shadow:var(--shadow)}
.progress{color:var(--ink2);font-size:13px;font-weight:800}
.picked{display:flex;gap:8px;align-items:flex-start;background:#f7f3ff;border-radius:14px;padding:8px 10px;margin:6px 0}
.picked em{font-style:normal;font-weight:900;color:var(--purple);flex:none}
.fig{margin:8px 0 12px}
.fig svg{width:100%;height:auto;display:block;border-radius:16px}
.empty{color:var(--ink2);padding:12px 0}
.foot{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:12px}
.foot > *{min-width:0}
.mascot{display:flex;gap:10px;align-items:center;margin:8px 0 4px}
.mascot p{background:#fff;border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);font-size:15px}
#toast{
  position:fixed;left:16px;right:16px;bottom:18px;z-index:30;
  background:#3e2a4a;color:#fff;border-radius:16px;padding:12px 14px;
  text-align:center;font-weight:800;opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s;
}
#toast.show{opacity:1;transform:none}
@media(min-width:900px){
  .wrap{padding-top:22px}
  .actions.home{grid-template-columns:1.3fr 1fr 1fr}
  .topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .topic-grid .topic{margin:0}
  .drill-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .write-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start}
  .bank-col{position:sticky;top:12px}
}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

function load(){
  store = defaultStore();

    var o = JSON.parse(raw);
    if(o && o.v===1){
      store = defaultStore();

    }
  }catch(e){}
}

function ymd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function touchDay(){
  var t = ymd(new Date());
  if(store.lastDay===t) return;
  var y = new Date();
  y.setDate(y.getDate()-1);
  store.streak = store.lastDay===ymd(y) ? store.streak+1 : 1;
  store.lastDay = t;
}

function esc(s){

function sound(kind){
  if(store.mute) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = audioCtx || new AC();
    if(audioCtx.state==='suspended') audioCtx.resume();
    var notes = kind==='ok' ? [523,659] : kind==='star' ? [523,659,784] : kind==='no' ? [311,233] : [494];
    notes.forEach(function(f,i){
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = kind==='no' ? 'triangle' : 'sine';
      o.frequency.value = f;
      o.connect(g); g.connect(audioCtx.destination);
      var t = audioCtx.currentTime + i*0.09;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.2);
      o.start(t); o.stop(t+0.22);
    });
  }catch(e){}
}

  var ask = '';
  if(session.askSkip){
    ask = '<div class="ask">提纲还空着，写的时候容易乱。要不要先填两句？<div class="row2" style="margin-top:8px"><button class="btn ghost" data-act="stay-outline">先去填</button><button class="btn primary" data-act="force-write">先写也行</button></div></div>';
  }
  return '<p class="hint">把题目拆开。每张卡片只想一件事。点下面的句子开头，可以放进格子里，再接着写。</p>'
    + cards + ask + '<button class="btn primary" data-act="to-write">开始分段写</button>';
}
function paraHtml(t,d){
  var n = draftCount(d);
  var blocks = [
    {k:'open', name:'开头', tip:'用两三句把人引进来，先别把结果说完。'},
    {k:'mid', name:'中间', tip:'按提纲写具体的事。加上动作、对话或样子。'},
    {k:'end', name:'结尾', tip:'回到开头的人或物，写你的感受，不要另起一个故事。'}
  ].map(function(b){
    return '<div class="field"><label>'+b.name+' <span class="pcount" data-pcount="'+b.k+'">'+countChars(d.paras[b.k])+' 字</span></label>'
      + '<p class="hint">'+b.tip+'</p>'
      + '<textarea data-para="'+b.k+'">'+esc(d.paras[b.k]||'')+'</textarea></div>';
  }).join('');
  var chips = t.words.map(function(w,i){
    return '<button type="button" class="chip" data-act="word" data-wi="'+i+'">'+esc(w)+'</button>';
  }).join('');
  return '<div class="wbar"><div id="wc">已写 <b id="wcNum">'+n+'</b> 字</div>'
    + '<div id="wcHint">五年级一般 400 字左右，写不到也没关系</div></div>'
    + '<div class="write-layout"><div>'+blocks+'</div>'
    + '<aside class="bank-col card"><div class="sec-h">好词好句</div><p class="hint">点一下，放进你正在写的那一段。先点一下那一段的空白处，再点词语。</p><div class="bank">'+chips+'</div></aside></div>'
    + '<div class="foot"><button class="btn ghost" data-act="save">保存</button><button class="btn primary" data-act="to-check">写完，去自查</button></div>';
}
function checkListHtml(t,d){
  var ticks = CHECKS.map(function(c){
    var on = d.ticks[c.k] ? ' on' : '';
    return '<button type="button" class="tick'+on+'" data-act="tick" data-k="'+c.k+'" aria-pressed="'+(d.ticks[c.k]?'true':'false')+'"><span class="box">'+(d.ticks[c.k]?'✓':'')+'</span><span>'+esc(c.t)+'</span></button>';
  }).join('');
  var done = d.starGiven ? '<p class="hint">这篇已经收过星星。改一改再保存也可以。</p>' : '<p class="hint">五项都是你自己打勾。勾完并且写了内容，就送你 3 颗星。</p>';
  return '<div class="ask">写完先别急着交给别人。对着清单问自己，做到的才打勾。</div>'
    + ticks + done
    + '<div class="foot"><button class="btn ghost" data-act="save">保存</button><button class="btn mint" data-act="finish">这篇写好了</button></div>'
    + '<p class="progress" style="margin-top:8px">全文 '+draftCount(d)+' 字</p>';
}

function drillHtml(){
  var dr = session.drill;
  var it = dr.items[dr.i];
  var head = topbar(drillName(dr.kind))
    + '<p class="progress">第 '+(dr.i+1)+' / '+dr.items.length+' 题'
    + (it.type ? ' · <span class="tag">'+esc(it.type)+'</span>' : '') + '</p>';
  var stemText = it.kind==='specific' ? '' : (it.kind==='sick'||it.kind==='expand' ? '原句：'+it.stem : (it.stem||''));
  var stem = stemText ? '<div class="stem">'+esc(stemText)+'</div>' : '';
  var body = it.kind==='order' ? orderBody(it, dr) : choiceBody(it, dr);
  var whyCls = 'why'+(dr.why ? ' show' : '')+(dr.whyGood ? ' good' : '');
  var next = dr.locked ? '<button class="btn primary" data-act="d-next">'+(dr.i<dr.items.length-1?'下一题':'看结果')+'</button>' : '';
  return '<div class="wrap" data-screen="drill">'+head+'<h3 class="qtitle">'+esc(it.prompt)+'</h3>'+stem+body
    + '<div id="drillWhy" class="'+whyCls+'">'+esc(dr.why||'')+'</div>'+next+'</div>';
}
function drillName(kind){
  for(var i=0;i<DRILL_META.length;i++) if(DRILL_META[i].kind===kind) return DRILL_META[i].name;
  return '小练习';
}
function choiceBody(it, dr){
  return it.options.map(function(op,i){
    var cls = 'choice';
    if(dr.locked && i===it.answer) cls += ' good';
    if((dr.bad||[]).indexOf(i)>=0) cls += ' bad';
    var dis = (dr.locked || (dr.bad||[]).indexOf(i)>=0) ? ' disabled' : '';
    return '<button class="'+cls+'" data-act="dopt" data-i="'+i+'"'+dis+'>'+esc(op)+'</button>';
  }).join('');
}
function orderBody(it, dr){
  var rank = {};
  dr.seq.forEach(function(pos,n){ rank[pos]=n+1; });
  var btns = it.shuffle.map(function(si,pos){
    var on = rank[pos] ? ' good' : '';
    var dis = (dr.locked || rank[pos]) ? ' disabled' : '';
    var badge = rank[pos] ? rank[pos]+' ' : '';
    return '<button class="choice'+on+'" data-act="pick" data-i="'+pos+'"'+dis+'>'+badge+esc(it.sentences[si])+'</button>';
  }).join('');
  var picked = dr.seq.map(function(pos,n){
    var si = it.shuffle[pos];
    return '<div class="picked"><em>'+(n+1)+'</em><span>'+esc(it.sentences[si])+'</span></div>';
  }).join('');
  var tools = '';
  if(!dr.locked){
    tools = '<div class="row2"><button class="btn ghost" data-act="d-undo">撤销上一句</button><button class="btn primary" data-act="d-submit">我排好了</button></div>';
  }
  var reveal = '';
  if(dr.showOrder){
    reveal = '<div class="card" style="margin-top:8px"><div class="sec-h">可以这样排</div>'
      + it.sentences.map(function(s,i){ return '<div class="picked"><em>'+(i+1)+'</em><span>'+esc(s)+'</span></div>'; }).join('')
      + '</div>';
  }
  return '<p class="hint">按你觉得通顺的顺序点句子。点过的会标上序号。</p>'+btns
    + (picked ? '<div class="sec-h">你的顺序</div>'+picked : '') + tools + reveal;
}
function drillDoneHtml(){
  var dr = session.drill;
  return '<div class="wrap" data-screen="drill-done">'+topbar('练习结束')
    + '<div class="card"><h2 style="font-size:26px">这一组做完啦</h2>'
    + '<p style="margin-top:8px">一次就答对 <b>'+dr.correct+'</b> / '+dr.items.length+' 题</p>'
    + '<p>新拿到 <b>'+dr.stars+'</b> 颗星。会了的题，下次再做就不重复发星了。</p></div>'
    + '<div class="actions" style="margin-top:12px"><button class="btn primary" data-act="drills">再选一组</button>'
    + '<button class="btn ghost" data-act="home">回首页</button></div></div>';
}

function openTopic(id){
  if(!store.drafts[id]) store.drafts[id] = newDraft(id);
  session.topicId = id;
  session.screen = 'write';
  session.misses = [];
  session.lastWhy = '';
  session.whyGood = false;
  session.askSkip = false;
  session.forceWrite = false;
  session.focusPara = 'open';
  persist();
  render();
}
function startDrill(kind){
  var items = pool(kind).slice(0,5);
  session.drill = {kind:kind, items:items, i:0, locked:false, correct:0, stars:0, first:null, why:'', whyGood:false, seq:[], tries:0, showOrder:false, bad:[]};
  session.screen = 'drill';
  render();
}
function awardDrill(it, firstTry){
  var dr = session.drill;
  if(!firstTry) return;
  dr.correct++;
  if(!store.drills[it.id]){
    store.drills[it.id] = 1;
    store.stars++;
    dr.stars++;
    sound('star');
  }else sound('ok');
}

function onClick(e){
  var btn = e.target.closest('[data-act]');
  if(!btn) return;
  var act = btn.dataset.act;
  if(act==='mute'){
    store.mute = !store.mute;
    persist();
    render();
    return;
  }
  if(act==='home'){ session.screen='home'; render(); return; }
  if(act==='topics'){ session.screen='topics'; render(); return; }
  if(act==='drafts'){ session.screen='drafts'; render(); return; }
  if(act==='drills'){ session.screen='drills'; render(); return; }
  if(act==='back'){ goBack(); return; }
  if(act==='open-topic' || act==='resume'){ openTopic(btn.dataset.id); return; }
  if(act==='start-drill'){ startDrill(btn.dataset.kind); return; }
  if(act==='copt'){ pickCheck(+btn.dataset.i); return; }
  if(act==='c-next'){ nextCheck(); return; }
  if(act==='starter'){ insertStarter(btn.dataset.key, +btn.dataset.si); return; }
  if(act==='to-write'){ goWrite(false); return; }
  if(act==='force-write'){ goWrite(true); return; }
  if(act==='stay-outline'){ session.askSkip=false; render(); return; }
  if(act==='word'){ insertWord(+btn.dataset.wi); return; }
  if(act==='save'){ touchDay(); persist(); toast('已经帮你收好了，下次打开还在'); sound('tap'); return; }
  if(act==='to-check'){ curDraft().step=3; curDraft().updated=Date.now(); touchDay(); persist(); render(); return; }
  if(act==='tick'){ toggleTick(btn); return; }
  if(act==='finish'){ finishDraft(); return; }
  if(act==='dopt'){ pickDrill(+btn.dataset.i); return; }
  if(act==='pick'){ pickOrder(+btn.dataset.i); return; }
  if(act==='d-undo'){ session.drill.seq.pop(); render(); return; }
  if(act==='d-submit'){ submitOrder(); return; }
  if(act==='d-next'){ nextDrill(); return; }
}
function goBack(){
  if(session.screen==='write'){
    var d = curDraft();
    if(d.step===0 && d.qi>0){
      d.qi--; session.misses=[]; session.lastWhy=''; session.whyGood=false; persist(); render(); return;
    }
    if(d.step>0){ d.step--; persist(); render(); return; }
    session.screen='topics'; render(); return;
  }
  if(session.screen==='drill' || session.screen==='drill-done'){ session.screen='drills'; render(); return; }
  session.screen='home'; render();
}
function pickCheck(i){
  var d = curDraft(), c = curTopic().checks[d.qi];
  if(d.solved[d.qi]) return;
  if(i===c.ans){
    d.solved[d.qi] = true;
    session.lastWhy = c.why[i] || '想对啦，就是这个意思。';
    session.whyGood = true;
    d.updated = Date.now();
    sound('ok');
    persist();
  }else{
    if(session.misses.indexOf(i)<0) session.misses.push(i);
    session.lastWhy = c.why[i];
    session.whyGood = false;
    sound('no');
  }
  render();
}
function nextCheck(){
  var d = curDraft();
  if(!d.solved[d.qi]) return;
  session.misses = [];
  session.lastWhy = '';
  session.whyGood = false;
  if(d.qi<2) d.qi++;
  else d.step = 1;
  d.updated = Date.now();
  persist();
  render();
}
function insertStarter(key, si){
  var d = curDraft();
  var card = null;
  curTopic().outline.forEach(function(c){ if(c.key===key) card=c; });
  if(!card) return;
  var text = card.starters[si];
  var cur = d.outline[key] || '';
  d.outline[key] = cur ? (cur.replace(/\s+$/,'')+'\n'+text) : text;
  d.updated = Date.now();
  var ta = document.querySelector('[data-ol="'+key+'"]');
  if(ta) ta.value = d.outline[key];
  else render();
  touchDay(); persist();
  sound('tap');
}
function goWrite(force){
  var d = curDraft();
  var keys = ['when','open','mid1','mid2','end'];
  var empty = keys.every(function(k){ return !(d.outline[k]||'').trim(); });
  if(empty && !force && !session.forceWrite){
    session.askSkip = true;
    render();
    return;
  }
  session.askSkip = false;
  session.forceWrite = true;
  d.step = 2;
  d.updated = Date.now();
  persist();
  render();
}
function insertWord(i){
  var d = curDraft();
  var w = curTopic().words[i];
  var key = session.focusPara || 'open';
  if(!d.paras[key] && key!=='open' && !document.querySelector('[data-para="'+key+'"]')) key = 'open';
  d.paras[key] = (d.paras[key]||'') + w;
  d.updated = Date.now();
  var ta = document.querySelector('[data-para="'+key+'"]');
  if(ta) ta.value = d.paras[key];
  updateWC();
  touchDay(); persist();
  var name = {open:'开头', mid:'中间', end:'结尾'}[key];
  toast('已放进'+name);
  sound('tap');
}
function updateWC(){
  var d = curDraft();
  if(!d) return;
  var num = document.getElementById('wcNum');
  if(num) num.textContent = String(draftCount(d));
  ['open','mid','end'].forEach(function(k){
    var p = document.querySelector('[data-pcount="'+k+'"]');
    if(p) p.textContent = countChars(d.paras[k])+' 字';
  });
}
function onInput(e){
  var el = e.target, d = session.topicId && store.drafts[session.topicId];
  if(!d) return;
  if(el.dataset && el.dataset.ol){
    d.outline[el.dataset.ol] = el.value;
    d.updated = Date.now();
    schedule();
  }
  if(el.dataset && el.dataset.para){
    d.paras[el.dataset.para] = el.value;
    d.updated = Date.now();
    updateWC();
    schedule();
  }
}
function toggleTick(btn){
  var d = curDraft();
  var k = btn.dataset.k;
  d.ticks[k] = !d.ticks[k];
  d.updated = Date.now();
  btn.classList.toggle('on', d.ticks[k]);
  btn.setAttribute('aria-pressed', d.ticks[k] ? 'true' : 'false');
  var box = btn.querySelector('.box');
  if(box) box.textContent = d.ticks[k] ? '✓' : '';
  schedule();
}
function finishDraft(){
  var d = curDraft();
  var all = CHECKS.every(function(c){ return !!d.ticks[c.k]; });
  if(!all){ toast('先把五项都看一遍，做到了再打勾'); sound('no'); return; }
  if(draftCount(d)<20){ toast('再写具体一点，满二十个字就能收星星'); sound('no'); return; }
  d.finished = true;
  d.updated = Date.now();
  if(!d.starGiven){
    d.starGiven = true;
    store.stars += 3;
    store.awarded[d.topicId] = true;
    toast('这篇写完啦，收到 3 颗星');
    sound('star');
  }else toast('这篇已经收过星星，修改也已经保存');
  touchDay(); persist();
}
function pickDrill(i){
  var dr = session.drill;
  var it = dr.items[dr.i];
  if(dr.locked) return;
  if(dr.first==null) dr.first = i;
  if(i===it.answer){
    dr.locked = true;
    dr.why = it.explain;
    dr.whyGood = true;
    awardDrill(it, dr.first===it.answer);
    if(dr.first!==it.answer) sound('ok');
  }else{
    if(dr.bad.indexOf(i)<0) dr.bad.push(i);
    dr.why = it.why[i];
    dr.whyGood = false;
    sound('no');
  }
  touchDay(); persist(); render();
}
function pickOrder(i){
  var dr = session.drill;
  if(dr.locked) return;
  if(dr.seq.indexOf(i)>=0) return;
  dr.seq.push(i);
  sound('tap');
  render();
}
function submitOrder(){
  var dr = session.drill;
  var it = dr.items[dr.i];
  if(dr.locked) return;
  if(dr.seq.length!==it.sentences.length){
    dr.why = '还有句子没排进去。每一句都要点到。';
    dr.whyGood = false;
    render();
    return;
  }
  var expect = orderTaps(it);
  var same = dr.seq.every(function(v,idx){ return v===expect[idx]; });
  if(dr.first==null) dr.first = same ? 1 : 0;
  if(same){
    dr.locked = true;
    dr.why = it.explain;
    dr.whyGood = true;
    awardDrill(it, dr.tries===0);
    touchDay(); persist(); render();
    return;
  }
  dr.tries++;
  if(dr.tries>=2){
    dr.locked = true;
    dr.showOrder = true;
    dr.why = it.explain;
    dr.whyGood = false;
    sound('no');
  }else{
    dr.seq = [];
    dr.why = '顺序还有一点乱。先找哪一句是开头，哪一句是结尾，再试一次。';
    dr.whyGood = false;
    sound('no');
  }
  touchDay(); persist(); render();
}
function nextDrill(){
  var dr = session.drill;
  if(!dr.locked) return;
  if(dr.i>=dr.items.length-1){ session.screen='drill-done'; render(); return; }
  dr.i++;
  dr.locked = false;
  dr.first = null;
  dr.why = '';
  dr.whyGood = false;
  dr.seq = [];
  dr.tries = 0;
  dr.showOrder = false;
  dr.bad = [];
  render();
}

function boot(){
  load();
  var app = document.getElementById('app');
  app.addEventListener('click', onClick);
  app.addEventListener('input', onInput);
  app.addEventListener('focusin', function(e){
    if(e.target && e.target.dataset && e.target.dataset.para) session.focusPara = e.target.dataset.para;
  });
  render();
}
boot();

window.ZW = {
  get store(){ return store; },
  get session(){ return session; },
  count: countChars,
  orderTaps: orderTaps,
  drillItem: function(){ return session.drill ? session.drill.items[session.drill.i] : null; }
};

/*APP-END*/
</script>
</body>
</html>
